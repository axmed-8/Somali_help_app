<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — {{ content.app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/gurmadnet.css') }}">
</head>
<body class="gn-auth auth-page">
  <div class="auth-container">
    <div class="auth-card" role="main">
      <div class="auth-header">
        <span class="auth-logo" aria-hidden="true">SH</span>
        <h1>Forgot Password</h1>
        <p>Enter your registered email. We will send a one-time code.</p>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="auth-alerts" aria-live="polite">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}" role="{{ 'alert' if category in ['error', 'warning'] else 'status' }}">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      <form method="post" class="auth-form" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label for="email">Registered email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            inputmode="email"
            placeholder="Email"
            value="{{ email|default('', true) }}"
          >
        </div>
        <button type="submit" class="btn-auth btn-primary-auth">Send reset code</button>
      </form>
      <p class="auth-footer"><a href="{{ url_for('login') }}">← Back to login</a></p>
    </div>
  </div>
</body>
</html>
