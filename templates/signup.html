<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - {{ content.app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/gurmadnet.css') }}">
</head>
<body class="gn-auth auth-page">
  <div class="auth-container">
    <div class="auth-card auth-card-wide">
      <div class="auth-header">
        <span class="auth-logo">AI</span>
        <h1>Create Account</h1>
        <p>Join {{ content.app_name }} — Somalia Emergency Platform</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('signup') }}" class="auth-form">
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" required placeholder="Ahmed Hassan">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="0612345678">
        </div>
        <div class="form-group">
          <label for="role">Account type</label>
          <select id="role" name="role" required>
            <option value="citizen">Citizen — Report & track emergencies</option>
            <option value="hospital">Emergency Responder — Medical / Ambulance</option>
            <option value="police">Emergency Responder — Police</option>
            <option value="fire">Emergency Responder — Fire & Rescue</option>
          </select>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
        </div>
        <button type="submit" class="btn-auth btn-primary-auth">Create Account</button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="{{ url_for('login') }}">Log in</a>
      </p>
    </div>
  </div>
</body>
</html>
