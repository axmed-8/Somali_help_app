# Render Blueprint — deployment only. Does not change application code.
# Dashboard: New → Blueprint → connect this GitHub repo

services:
  - type: web
    name: gurmadnet-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GURMADNET_DB
        value: json
      - key: SECRET_KEY
        generateValue: true
