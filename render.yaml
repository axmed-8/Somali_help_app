# GurmadNet on Render — uses Railway MySQL (public TCP proxy).
# Set MYSQL_PASSWORD in the Render dashboard from Railway → MySQL → Variables.
# Do not use localhost / Axmed MySQL80.

services:
  - type: web
    name: gurmadnet-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 25 -w 1 --bind 0.0.0.0:$PORT --timeout 120 app:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GURMADNET_DB
        value: mysql
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: WTF_CSRF_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: memory
      # Railway MySQL (service "MySQL" in project talented-consideration)
      - key: MYSQL_HOST
        value: sakura.proxy.rlwy.net
      - key: MYSQL_PORT
        value: "33388"
      - key: MYSQL_USER
        value: root
      - key: MYSQL_DATABASE
        value: railway
      # Paste the Railway MYSQL_PASSWORD in Render dashboard (do not commit secrets)
      - key: MYSQL_PASSWORD
        sync: false
      # Railway public TCP proxy is plain MySQL (TLS causes WRONG_VERSION_NUMBER / 2013)
      - key: MYSQL_SSL
        value: "false"
      - key: MYSQL_CONNECT_TIMEOUT
        value: "20"
      - key: MYSQL_CONNECT_RETRIES
        value: "2"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: WEBRTC_STUN_URL
        value: "stun:stun.l.google.com:19302"
      - key: WEBRTC_TURN_URL
        sync: false
      - key: WEBRTC_TURN_USERNAME
        sync: false
      - key: WEBRTC_TURN_CREDENTIAL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
